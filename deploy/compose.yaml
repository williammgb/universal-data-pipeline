name: udp

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: udp
      POSTGRES_DB: udp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${UDP_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U udp -d udp"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A stand-in business database for the database connector; test and demo use only.
  source-postgres:
    profiles: ["demo"]
    image: postgres:18.6
    environment:
      POSTGRES_USER: source
      POSTGRES_DB: source
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${UDP_SOURCE_PG_PORT:-5433}:5432"
    volumes:
      - ./source-postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U source -d source"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The fake REST API from tests/mock_api.py; test and demo use only.
  mock-api:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint:
      ["uvicorn", "--app-dir", "/mock", "--factory", "mock_api:app_from_env", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MOCK_API_TOKEN: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${UDP_MOCK_API_PORT:-8081}:8000"
    volumes:
      - ../tests/mock_api.py:/mock/mock_api.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  app: &app
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      UDP_DATABASE_URL: postgresql://udp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/udp
      DEMO_DB_URL: postgresql://source:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@source-postgres:5432/source
      DEMO_API_URL: http://mock-api:8000
      DEMO_API_TOKEN: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ../sources:/app/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["doctor"]

  # The HTTP API, published on this machine only until it has API keys (slice 10).
  api:
    <<: *app
    command: ["api", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${UDP_API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Scrapes the api's /api/metrics; its query page is published on this machine only.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.14.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${UDP_PROM_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs every dataset with a `schedule:` in source.yaml; schedules are read at start.
  scheduler:
    <<: *app
    command: ["schedule"]
    init: true
    restart: unless-stopped

volumes:
  pgdata:
