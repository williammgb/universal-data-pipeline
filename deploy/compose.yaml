name: udp

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: udp
      POSTGRES_DB: udp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${UDP_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U udp -d udp"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      UDP_DATABASE_URL: postgresql://udp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/udp
    depends_on:
      postgres:
        condition: service_healthy
    command: ["doctor"]

volumes:
  pgdata:
