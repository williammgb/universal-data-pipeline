# One job: the platform's metrics, read from its database by the api container on each scrape.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: udp
    metrics_path: /api/metrics
    # The metrics need the API key like every other /api address; the file holds only the key.
    authorization:
      credentials_file: /etc/prometheus/api.key
    static_configs:
      - targets: ["api:8000"]
