name: udp

# The platform from the published image, with no source code needed: download this file into
# an empty folder, set POSTGRES_PASSWORD and UDP_API_KEYS, and `docker compose -f
# compose.release.yaml up -d --wait`. UDP_VERSION pins a release (1.2.0); it defaults to latest.
# The services are copied from compose.yaml, which builds the image from the source instead.
# Its demo, scale and monitoring services need files from the source, so they are not here.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: udp
      POSTGRES_DB: udp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${UDP_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U udp -d udp"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # The anchor every container on the image inherits, and the one-off runner for
  # `compose run --rm app load <source>`. Its own profile keeps it out of a plain `up`, which
  # the containers below undo with an empty profile list so they start by default.
  app: &app
    profiles: ["app"]
    image: ghcr.io/williammgb/universal-data-pipeline:${UDP_VERSION:-latest}
    environment:
      UDP_DATABASE_URL: postgresql://udp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/udp
      UDP_API_KEYS: ${UDP_API_KEYS:-}
    volumes:
      # Folders next to this file; Docker makes an empty one when it is missing.
      - ./sources:/app/sources:ro
      - ./pipelines:/app/pipelines:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["doctor"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  # Creates or updates the platform tables, then exits; everything on the app anchor waits for it.
  migrate:
    <<: *app
    profiles: []
    command: ["update"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # The dashboard and the HTTP API, published on this machine only.
  api:
    <<: *app
    profiles: []
    command: ["api", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${UDP_API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs every dataset with a `schedule:` in source.yaml; schedules are read at start.
  scheduler:
    <<: *app
    profiles: []
    command: ["schedule"]
    init: true
    restart: unless-stopped

volumes:
  pgdata:
