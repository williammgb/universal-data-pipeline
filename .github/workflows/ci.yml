name: ci

on:
  push:
  pull_request:

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: ./run setup
      - run: ./run fast
