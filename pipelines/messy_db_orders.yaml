# messy_db's orders, from RAW to clean.messy_db__orders: regions and statuses spelt one way,
# rows whose quantity or date cannot be read dropped, types set, the outlier amount capped and
# the gaps filled. A repeated order and a negative quantity are reported, not hidden.
#   uv run --locked udp run messy_db
#   uv run --locked udp pipeline run messy_db_orders
source: messy_db
dataset: orders
profile: ends
constraints:
  - constraint: not_null
    column: id
    critical: true
  - constraint: allowed_values
    column: region
    values: [north, south, east, west]
    critical: true
  - constraint: allowed_values
    column: status
    values: [paid, open, refunded]
    critical: true
  - constraint: unique
    columns: [id]
  - constraint: min
    column: quantity
    value: 0
steps:
  - type: normalize_values
    columns: [region, status]
    case: lower
    mapping:
      zuid: south
      oost: east
  - type: validate
    constraints:
      - constraint: datatype
        column: quantity
        type: integer
      - constraint: datatype
        column: ordered_on
        type: date
    on_invalid: drop
  - type: convert_type
    column: quantity
    to: integer
  - type: convert_type
    column: ordered_on
    to: date
  - type: outliers
    column: amount
    action: cap
    lower_percentile: 0
    upper_percentile: 90
  - type: fill_missing
    columns: [amount]
    method: median
  - type: fill_missing
    columns: [customer]
    method: value
    value: unknown
