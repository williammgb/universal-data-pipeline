connection:
  type: excel
datasets:
  # Tableau's "Sample - Superstore" workbook: orders, regional managers and returns. The file
  # is not in git; fetch it into data/ with
  #   curl -Lo data/superstore.xlsx https://github.com/PacktPublishing/Getting-Started-with-Tableau-2019.2/raw/master/Chapter03/Sample-Superstore.xlsx
  - name: orders
    path: data/superstore.xlsx
    sheet: Orders
    load_mode: full
    columns:
      sales: decimal(12,4)
      profit: decimal(12,4)
    checks:
      - check: unique
        columns: [row_id]
      - check: not_null
        column: order_id
      - check: range
        column: discount
        min: 0
        max: 1
  - name: people
    path: data/superstore.xlsx
    sheet: People
    load_mode: full
  - name: returns
    path: data/superstore.xlsx
    sheet: Returns
    load_mode: full
